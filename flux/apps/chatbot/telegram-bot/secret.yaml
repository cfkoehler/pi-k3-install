apiVersion: v1
kind: Secret
metadata:
  name: telegram-bot-credentials
  namespace: chatbot
  labels:
    managed-by: flux
stringData:
  # TODO(connor): set the real bot token from @BotFather
  TELEGRAM_BOT_TOKEN: "REPLACE_ME"
  # TODO(connor): comma-separated Telegram chat IDs allowed to use the bot
  TELEGRAM_ALLOWED_IDS: "REPLACE_ME"
  # TODO(connor): fill in real Mac LAN IP
  ROUTER_BASE_URL: "http://ROUTER_LAN_IP:8090"
  # TODO(connor): set the real bearer token for the Mac-hosted router
  ROUTER_API_KEY: "REPLACE_ME"
